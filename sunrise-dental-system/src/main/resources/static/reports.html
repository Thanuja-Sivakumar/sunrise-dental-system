<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/reports.css">

</head>
<body>
    <header>
        <h1>🦷 Sunrise Dental Clinic</h1>
        <nav><a href="/dashboard.html">← Back to Menu</a></nav>
    </header>
    <div class="main-wrap">
    <div class="container">
        <h2>Daily Reports</h2>
        <label for="reportDate">Select Date</label>
        <input type="date" id="reportDate">
        <button onclick="runReports()">Generate Reports</button>

        <div id="msg" class="message" style="display:none;"></div>

        <h3>Appointment Schedule</h3>
        <table id="scheduleTable">
            <thead>
                <tr><th>Appt No</th><th>Patient</th><th>Dentist</th><th>Treatment</th><th>Time</th></tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>

        <h3>Revenue Summary</h3>
        <p id="revenueSummary" class="helptext"></p>
    </div>
    </div>
    <div class="bottom-nav">
        <button class="back-btn" onclick="history.back()"> Back</button>
        <a class="home-btn" href="/dashboard.html"> Home</a>
    </div>
    <footer class="site-footer">
        <p class="footer-tagline">Let's keep your smile healthy and bright - right here!</p>
        <p class="footer-links"><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
        <p class="footer-hotline">Hotline: 054 4554556</p>
    </footer>
    <script src="/js/app.js"></script>
    <script>
        requireLogin();

        async function runReports() {
            const date = document.getElementById('reportDate').value;
            if (!date) { showMessage('msg', 'Please choose a date.', 'error'); return; }

            try {
                const schedule = await apiFetch('/reports/daily-schedule?date=' + date);
                const body = document.getElementById('scheduleBody');
                body.innerHTML = '';
                schedule.forEach(a => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${a.appointmentNumber}</td><td>${a.patientName}</td><td>${a.dentistName}</td><td>${a.treatmentTypeName}</td><td>${a.appointmentTime}</td>`;
                    body.appendChild(row);
                });

                const revenue = await apiFetch('/reports/daily-revenue?date=' + date);
                document.getElementById('revenueSummary').textContent =
                    `${revenue.totalAppointments} appointment(s) on ${revenue.date}, total revenue so far: Rs. ${revenue.totalRevenue}`;
                document.getElementById('msg').style.display = 'none';
            } catch (err) {
                showMessage('msg', err.message, 'error');
            }
        }
    </script>
</body>
</html>
