<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">

</head>
<body>
    <header>
        <h1>🦷 Sunrise Dental Clinic</h1>
    </header>
    <div class="main-wrap">
        <div class="container" style="max-width:420px;">
        <h2>Staff Login</h2>
        <p class="helptext">Only authorized clinic staff may access this system.</p>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="e.g. reception">

            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">

            <button type="submit">Log In</button>
        </form>
        <div id="msg" class="message" style="display:none;"></div>
        <p class="helptext">Demo accounts — admin / reception, password: <code>password123</code></p>
    </div>
    </div>
    <footer class="site-footer">
        <p class="footer-tagline">Let's keep your smile healthy and bright - right here!</p>
        <p class="footer-links"><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
        <p class="footer-hotline">Hotline: 054 4554556</p>
    </footer>
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    showMessage('msg', data.message || 'Invalid username or password.', 'error');
                    return;
                }

                // Store Basic-Auth credentials for subsequent API calls made by app.js
                sessionStorage.setItem('creds', btoa(username + ':' + password));
                sessionStorage.setItem('fullName', data.fullName);
                showMessage('msg', data.message, 'success');
                setTimeout(() => window.location.href = '/dashboard.html', 500);
            } catch (err) {
                showMessage('msg', 'Unable to reach the server. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
