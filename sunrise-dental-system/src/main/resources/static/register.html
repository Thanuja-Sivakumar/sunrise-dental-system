<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Appointment - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/register.css">

</head>
<body>
    <header>
        <h1>🦷 Sunrise Dental Clinic</h1>
        <nav><a href="/dashboard.html">← Back to Menu</a></nav>
    </header>
    <div class="main-wrap">
    <div class="container">
        <h2>Register New Appointment</h2>
        <form id="regForm">
            <label for="patientName">Patient Name</label>
            <input type="text" id="patientName" required maxlength="100">

            <label for="address">Address</label>
            <input type="text" id="address" required>

            <label for="contactNumber">Contact Number</label>
            <input type="text" id="contactNumber" required placeholder="e.g. 0771234567">

            <label for="dentistId">Dentist</label>
            <select id="dentistId" required></select>

            <label for="treatmentTypeId">Treatment Type</label>
            <select id="treatmentTypeId" required></select>

            <label for="appointmentDate">Appointment Date</label>
            <input type="date" id="appointmentDate" required>

            <label for="appointmentTime">Appointment Time</label>
            <input type="time" id="appointmentTime" required>

            <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
                <input type="checkbox" id="emergency" style="width:auto; margin:0;"> This is an emergency appointment (25% surcharge applies)
            </label>

            <button type="submit">Register Appointment</button>
        </form>
        <div id="msg" class="message" style="display:none;"></div>
    </div>
    </div>
    <div class="bottom-nav">
        <button class="back-btn" onclick="history.back()"> Back</button>
        <a class="home-btn" href="/dashboard.html"> Home</a>
    </div>
    <footer class="site-footer">
        <p class="footer-tagline">Let's keep your smile healthy and bright - right here!</p>
        <p class="footer-links"><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
        <p class="footer-hotline">Hotline: 054 4554556</p>
    </footer>
    <script src="/js/app.js"></script>
    <script>
        requireLogin();

        async function loadOptions() {
            const dentists = await apiFetch('/dentists');
            const dentistSelect = document.getElementById('dentistId');
            dentists.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = `${d.name} (${d.specialization})`;
                dentistSelect.appendChild(opt);
            });

            const treatments = await apiFetch('/treatment-types');
            const treatmentSelect = document.getElementById('treatmentTypeId');
            treatments.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = `${t.name} - Rs. ${t.cost} (+ Rs. ${t.consultationFee} consultation)`;
                treatmentSelect.appendChild(opt);
            });
        }
        loadOptions().catch(err => showMessage('msg', err.message, 'error'));

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                patientName: document.getElementById('patientName').value.trim(),
                address: document.getElementById('address').value.trim(),
                contactNumber: document.getElementById('contactNumber').value.trim(),
                dentistId: Number(document.getElementById('dentistId').value),
                treatmentTypeId: Number(document.getElementById('treatmentTypeId').value),
                appointmentDate: document.getElementById('appointmentDate').value,
                appointmentTime: document.getElementById('appointmentTime').value,
                emergency: document.getElementById('emergency').checked
            };

            try {
                const result = await apiFetch('/appointments', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showMessage('msg',
                    `Appointment registered successfully! Appointment Number: ${result.appointmentNumber}`,
                    'success');
                document.getElementById('regForm').reset();
            } catch (err) {
                showMessage('msg', err.message, 'error');
            }
        });
    </script>
</body>
</html>
