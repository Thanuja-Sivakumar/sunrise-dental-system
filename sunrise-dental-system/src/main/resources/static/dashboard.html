<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>🦷 Sunrise Dental Clinic</h1>
        <nav>
            <span id="welcomeMsg"></span>
            <a href="#" onclick="logout()">Log Out</a>
        </nav>
    </header>
    <div class="container">
        <h2>Main Menu</h2>
        <p class="helptext">Select an option below. This menu mirrors the six core functions required by the system.</p>
        <div class="card-grid">
            <a class="card" href="/register.html">📝 Register New Appointment</a>
            <a class="card" href="/search.html">🔍 Display Appointment Details</a>
            <a class="card" href="/billing.html">💵 Calculate &amp; Print Bill</a>
            <a class="card" href="/reports.html">📊 Daily Reports</a>
            <a class="card" href="/help.html">❓ Help Section</a>
            <a class="card" href="#" onclick="logout(); return false;">🚪 Exit System (Log Out)</a>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        requireLogin();
        document.getElementById('welcomeMsg').textContent = 'Welcome, ' + (sessionStorage.getItem('fullName') || 'Staff');
    </script>
</body>
</html>
