spring.application.name=Sunrise Dental Clinic Management System

# ---------------------------------------------------------------
# DATABASE CONFIGURATION - MySQL (XAMPP)
# ---------------------------------------------------------------
# Start XAMPP and turn on the "MySQL" module (Apache is not required
# unless you also use phpMyAdmin). Default XAMPP MySQL credentials
# are username "root" with an EMPTY password on port 3306 - that is
# what's configured below. If you set a root password in XAMPP,
# update spring.datasource.password to match.
#
# createDatabaseIfNotExist=true means you do NOT need to create the
# "sunrise_dental" schema by hand - Spring Boot will create it on
# first run as long as the MySQL user has permission to do so
# (the default XAMPP root user does).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_dental?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

logging.level.com.sunrise.dental=DEBUG
