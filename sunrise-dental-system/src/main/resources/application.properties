spring.application.name=Sunrise Dental Clinic Management System

# ---------------------------------------------------------------
# DATABASE CONFIGURATION - MySQL (XAMPP)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_dental?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

logging.level.com.sunrise.dental=DEBUG
